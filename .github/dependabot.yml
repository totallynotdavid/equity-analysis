version: 2
updates:
  # === Python Workspace (uv) ===

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "master"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      python-workspace:
        patterns: ["*"]

  # === Frontend Package (Bun) ===

  - package-ecosystem: "bun"
    directory: "/web/"
    schedule:
      interval: "weekly"
    target-branch: "master"
    commit-message:
      prefix: "chore(deps-js)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      frontend:
        patterns: ["*"]
