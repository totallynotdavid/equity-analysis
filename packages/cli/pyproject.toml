[project]
name = "equity-analyzer-cli"
version = "0.1.0"
description = "A command-line interface for the Equity Analysis project."
dependencies = [
    "equity-analyzer-core"
]

[project.scripts]
eq = "equity_analyzer_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
equity-analyzer-core = { workspace = true }
