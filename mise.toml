[settings.python]
uv_venv_auto = true

[tools]
python = "3.14.7"
uv = "0.12.19"
bun = "1.4.2"

[tasks.install]
description = "Install all workspace packages and dependencies from the lockfiles"
alias = "i"
run = [
    "uv sync --all-packages --locked",
    "cd web && bun install --frozen-lockfile",
]

[tasks.fix]
description = "Lint & format all .py files"
alias = "f"
run = [
    "uv run ruff format . --config pyproject.toml",
    "uv run ruff check . --fix --unsafe-fixes --config pyproject.toml",
]

[tasks.mypy]
description = "Type check the entire codebase with mypy"
alias = "m"
run = "uv run mypy ."

[tasks.cli]
description = "Run the eq command-line interface"
run = "uv run eq"

[tasks.api]
description = "Start the FastAPI development server"
run = "uv run uvicorn index_api.main:app --reload --app-dir ./packages/api/"

[tasks.web]
description = "Start the Bun/Astro development server for the web frontend"
run = "bun --cwd ./web dev"
