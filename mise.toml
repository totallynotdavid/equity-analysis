[settings.python]
uv_venv_auto = true

[tools]
python = "3.14.7"
uv = "0.12.19"
bun = "1.4.2"

[env]
SEC_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"

[tasks.install]
description = "Install all workspace packages and dependencies from the lockfiles"
alias = "i"
run = [
    "uv sync --all-packages --locked",
    "cd web && bun install --frozen-lockfile",
]

[tasks.fix]
description = "Lint & format all .py files"
alias = "f"
run = [
    "uv run ruff format . --config pyproject.toml",
    "uv run ruff check . --fix --unsafe-fixes --config pyproject.toml",
]

[tasks.mypy]
description = "Type check the entire codebase with mypy"
alias = "m"
run = "uv run mypy ."

[tasks."check:python"]
description = "Lint, format check, type check and test the Python code"
run = [
    "uv run ruff check . --no-fix",
    "uv run ruff format --check .",
    "uv run mypy .",
    "uv run pytest -q -m 'not e2e'",
]

[tasks."check:e2e"]
description = "Run the end-to-end backtests that check leaves out"
run = "uv run pytest -q -m e2e"

[tasks."check:web"]
description = "Format check, test and build the web page"
dir = "web"
run = [
    "bunx prettier --check src tests astro.config.mjs vitest.config.ts",
    "bun run test",
    "bun run build",
]

[tasks.check]
description = "Every check CI runs, except the end-to-end backtests of check:e2e"
alias = "c"
depends = ["check:python", "check:web"]

[tasks.site]
description = "Export the latest scores and build the static page from them"
run = [
    "uv run eq export",
    "cd web && bun run build",
]

[tasks."deploy:data"]
description = "Score the demo universe on real data into deploy/scores.json. Needs TIINGO_API_KEY"
run = "scripts/deploy-data.sh"

[tasks.cli]
description = "Run the eq command-line interface"
run = "uv run eq"

[tasks.api]
description = "Start the FastAPI development server"
run = "uv run uvicorn index_api.main:app --reload"

[tasks.web]
description = "Start the Bun/Astro development server for the web frontend"
run = "bun --cwd ./web dev"
