[project]
name = "equity-analysis"
version = "1.0.0"
description = "A monorepo containing the core library, CLI, and API client."
requires-python = ">=3.14"

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/cli",
    "packages/api"
]

# ==========================================================
#           SHARED DEVELOPMENT TOOL CONFIGURATIONS
# ==========================================================

[tool.ruff]
fix = true
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# `select`, not `extend-select`, so a new ruff default cannot add rules.
# E4, E7, E9 and F are ruff's classic default set.
select = [
    "E4",  # pycodestyle: import rules
    "E7",  # pycodestyle: statement rules
    "E9",  # pycodestyle: runtime errors
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # eradicate
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TC",  # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
]
extend-safe-fixes = ["TC"]

[tool.ruff.lint.flake8-tidy-imports]
# Enforces clean, absolute imports, which is excellent for a monorepo.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false
lines-between-types = 1
lines-after-imports = 2

[tool.mypy]
python_version = "3.14"
strict = true
namespace_packages = true
explicit_package_bases = true

mypy_path = "packages/core:packages/cli:packages/api"

enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

# todo: ignoring missing stubs for third-party libraries for now
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "packages/core",
  "packages/cli",
  "packages/api"
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
